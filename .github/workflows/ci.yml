name: Qualy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualy-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Qualy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qualy
          POSTGRES_PASSWORD: qualy_ci
          POSTGRES_DB: qualy_ci
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U qualy -d qualy_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
        ports:
          - 5432

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit and PostgreSQL integration tests
        env:
          QUALY_TEST_DATABASE_URL: postgresql://qualy:qualy_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/qualy_ci
        run: npm test

      - name: Build for production
        run: npm run build

      - name: Apply the SQL migration to the browser test database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for migration in supabase/migrations/*.sql; do
            docker exec -i -e PGPASSWORD=qualy_ci "$PG_CONTAINER" \
              psql -h 127.0.0.1 -U qualy -d qualy_ci -v ON_ERROR_STOP=1 < "$migration"
          done

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test the production build in Chromium
        id: browser
        env:
          QUALY_TEST_DATABASE_URL: postgresql://qualy:qualy_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/qualy_ci
        run: npm run test:e2e

      - name: Save failed browser test traces
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualy-browser-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
